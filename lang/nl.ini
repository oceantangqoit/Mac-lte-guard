210=Te bewaken USB-apparaten kiezen…
211=Elk apparaat dat u hier aanvinkt, wordt na elke ontwaking automatisch via software losgekoppeld en weer aangesloten — hetzelfde als eruit trekken en terugsteken.\n\nDit is iets anders dan het bewaken van een netwerkinterface: een interface kun je toetsen aan IP, gateway en bereikbaarheid, en wordt alleen hersteld als hij echt stuk is. Een gewoon USB-apparaat biedt zo'n toets niet, dus rest slechts het onvoorwaardelijk opnieuw instellen.\n\nVink daarom alleen apparaten aan die op elk moment losgekoppeld mogen worden. Externe schijven, USB-sticks, SD-kaartlezers of een opnamekaart midden in een opname: wordt zo'n apparaat opnieuw ingesteld tijdens lezen of schrijven, dan bent u in het beste geval het bestand kwijt en moet in het ergste geval het hele volume hersteld worden. Laat die uitgevinkt; moet het toch, gebruik dan de eenmalige herstelling hieronder en verzeker u er eerst van dat er niets meer geschreven wordt.
