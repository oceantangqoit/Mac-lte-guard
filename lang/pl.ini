211=Urządzenia zaznaczone tutaj jako STRZEŻONE są po każdym wybudzeniu Maca automatycznie odłączane i podłączane programowo — to samo, co wyjąć wtyczkę i włożyć ją z powrotem.\n\nZaznaczaj tylko urządzenia, które można odłączyć w dowolnej chwili. To jedyny warunek, przy którym nic nie przepadnie.\n\nDyski zewnętrzne, pendrive'y, czytniki kart SD, karty przechwytujące w trakcie nagrywania: zresetowanie takiego urządzenia w trakcie odczytu lub zapisu to w najlepszym razie uszkodzony plik, w najgorszym partycja do naprawy. NIE zaznaczaj takich urządzeń.\n\nJeśli naprawdę trzeba, użyj jednorazowego resetu z menu poziom wyżej i sam się wcześniej upewnij, że odczyt i zapis ustały.
