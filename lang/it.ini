210=Scegliere i dispositivi USB da sorvegliare…
211=Ogni dispositivo spuntato qui subirà uno scollegamento e ricollegamento via software dopo ogni risveglio, l'equivalente di staccarlo e riattaccarlo.\n\nNon è la stessa cosa che sorvegliare un'interfaccia di rete: un'interfaccia si verifica con l'IP, il gateway e la connettività, e viene riparata solo quando è davvero guasta. Un normale dispositivo USB non offre una verifica del genere, perciò non resta che reimpostarlo senza condizioni.\n\nSpuntate quindi soltanto dispositivi che possono essere staccati in qualsiasi momento. Dischi esterni, chiavette USB, lettori di schede SD o una scheda di acquisizione in piena registrazione: se uno di questi viene reimpostato durante una lettura o una scrittura, nel migliore dei casi perdete il file, nel peggiore l'intero volume va riparato. Lasciateli non spuntati; se proprio dovete reimpostarne uno, usate la reimpostazione singola qui sotto dopo esservi accertati che nulla stia più scrivendo.
