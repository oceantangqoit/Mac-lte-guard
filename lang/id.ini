211=Setiap perangkat yang Anda centang di sini akan dicabut dan dipasang kembali secara perangkat lunak setiap kali Mac bangun — sama saja dengan mencabutnya lalu memasangnya lagi.\n\nIni tidak sama dengan menjaga antarmuka jaringan: antarmuka dapat diuji lewat IP, gerbang, dan sambungan, jadi hanya diperbaiki bila memang rusak. Perangkat USB biasa tidak memberi uji semacam itu, sehingga yang tersisa hanyalah mengatur ulang tanpa syarat.\n\nKarena itu centanglah hanya perangkat yang boleh dicabut kapan saja. Cakram luar, flash disk, pembaca kartu SD, atau kartu perekam yang sedang merekam: bila salah satunya diatur ulang saat sedang dibaca atau ditulis, paling ringan berkasnya rusak, paling berat seluruh volume harus diperbaiki. Jangan centang perangkat semacam itu; bila benar-benar perlu, gunakan pengaturan ulang sekali pakai di bawah, dan pastikan dulu penulisan sudah berhenti.
