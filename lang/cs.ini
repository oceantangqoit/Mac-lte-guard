210=Vybrat zařízení USB k hlídání…
211=Každé zde zaškrtnuté zařízení bude po každém probuzení softwarově odpojeno a znovu připojeno — totéž, jako byste je vytáhli a zase zasunuli.\n\nNení to totéž jako hlídání síťového rozhraní: rozhraní lze ověřit podle IP, brány a dostupnosti, a opravuje se jen tehdy, když je skutečně porouchané. Běžné zařízení USB takovou zkoušku neumožňuje, nezbývá než je bezpodmínečně resetovat.\n\nProto zaškrtávejte jen zařízení, která lze kdykoli odpojit. Externí disky, flash disky, čtečky karet SD či snímací karta uprostřed nahrávání: bude-li takové zařízení resetováno během čtení nebo zápisu, v lepším případě přijdete o soubor, v horším bude nutné opravit celý svazek. Ta nezaškrtávejte; je-li reset přesto nutný, použijte jednorázový reset níže a předtím se ujistěte, že se již nic nezapisuje.
