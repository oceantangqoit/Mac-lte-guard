211=الأجهزة التي تؤشّر عليها هنا بوصفها «محروسة» تُفصل وتُوصل برمجيًا بعد كل استيقاظ للـ Mac — وهو ما يعادل نزع القابس وإعادته.\n\nلا تؤشّر إلا على الأجهزة التي يجوز نزعها في أي لحظة. هذا هو الشرط الذي تسلم به بياناتك.\n\nالأقراص الخارجية، ذاكرات USB، قارئات بطاقات SD، بطاقات الالتقاط أثناء التسجيل: إعادة ضبط أحدها وهو يقرأ أو يكتب تعني في أحسن الأحوال ملفًا تالفًا، وفي أسوئها قسمًا يحتاج إصلاحًا. لا تؤشّر على هذه الأجهزة أبدًا.\n\nوإن اضطررت حقًا، فاستعمل إعادة الضبط المرة الواحدة من القائمة الأعلى، وتحقّق بنفسك أولًا من توقّف كل قراءة وكتابة.
