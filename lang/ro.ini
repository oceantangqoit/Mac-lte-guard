211=Dispozitivele bifate aici ca PĂZITE sunt deconectate și reconectate prin software după fiecare trezire a Mac-ului — echivalentul scoaterii ștecherului și punerii lui la loc.\n\nBifați numai dispozitive care pot fi deconectate în orice moment. Aceasta este condiția pentru a nu pierde date.\n\nDiscuri externe, stickuri USB, cititoare de carduri SD, plăci de captură în plină înregistrare: resetarea unuia dintre ele în timp ce citește sau scrie înseamnă, în cel mai bun caz, un fișier deteriorat, iar în cel mai rău, o partiție de reparat. NU bifați astfel de dispozitive.\n\nDacă este într-adevăr necesar, folosiți resetarea unică din meniul de la nivelul superior și asigurați-vă singuri, în prealabil, că orice citire și scriere a încetat.
