211=Hver enhet du krysser av her, blir etter hver oppvåkning frakoblet og tilkoblet igjen med programvare — det samme som å dra den ut og sette den inn igjen.\n\nDette er ikke det samme som å vokte et nettverksgrensesnitt: et grensesnitt kan prøves med IP, gateway og forbindelse, og repareres derfor bare når det virkelig er i stykker. En vanlig USB-enhet tillater ingen slik prøve, så det eneste som gjenstår er å tilbakestille den betingelsesløst.\n\nKryss derfor bare av for enheter som kan dras ut når som helst. Eksterne disker, USB-pinner, SD-kortlesere eller et opptakskort midt i et opptak: blir en slik enhet tilbakestilt under lesing eller skriving, mister du i beste fall filen, i verste fall må hele volumet repareres. La dem stå uten kryss; er tilbakestilling likevel nødvendig, bruk engangstilbakestillingen nedenfor etter å ha forsikret deg om at ingenting lenger skrives.
