211=Ang mga kagamitang tinitikan ninyong «binabantayan» sa screen na ito ay awtomatikong hinuhugot at isinasaksak muli sa pamamagitan ng software tuwing gigising ang Mac — katumbas ng paghugot ng saksak at pagbalik nito.\n\nTikan lamang ang mga kagamitang maaaring hugutin anumang sandali. Iyan ang kondisyon upang hindi mawala ang datos.\n\nMga panlabas na drive, USB stick, SD card reader, capture card na kasalukuyang nagre-record: ang pag-reset sa alinman sa mga ito habang nagbabasa o nagsusulat ay, sa pinakamagaan, isang sirang file, at sa pinakamalala, isang partisyong kailangang ayusin. Huwag na huwag tikan ang ganitong mga kagamitan.\n\nKung talagang kailangan, gamitin ang minsanang pag-reset sa menu na isang antas pataas, at tiyakin ninyo mismo muna na tumigil na ang lahat ng pagbabasa at pagsusulat.
