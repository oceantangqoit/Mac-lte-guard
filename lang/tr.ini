211=Burada işaretlediğiniz her aygıt, Mac her uyandığında yazılımla çıkarılıp yeniden takılır — elle çekip yeniden takmanın tam karşılığı.\n\nBu, bir ağ arabirimini gözetmekle aynı şey değildir: arabirim IP, ağ geçidi ve bağlanabilirlikle sınanabilir, bu yüzden ancak gerçekten bozulduğunda onarılır. Sıradan bir USB aygıtı böyle bir sınamaya elvermez; geriye koşulsuz sıfırlamaktan başka yol kalmaz.\n\nBu nedenle yalnızca her an çıkarılabilecek aygıtları işaretleyin. Harici diskler, USB bellekler, SD kart okuyucular ya da kayıt ortasındaki bir yakalama kartı: böyle bir aygıt okuma veya yazma sırasında sıfırlanırsa, hafifi dosyanın bozulmasıdır, ağırı tüm bölümün onarılmasını gerektirir. Onları işaretlemeyin; gerçekten gerekiyorsa aşağıdaki tek seferlik sıfırlamayı kullanın ve önce yazmanın durduğundan kendiniz emin olun.
