211=ဤနေရာတွင် အမှတ်ခြစ်ထားသော ကိရိယာတိုင်းကို Mac နိုးထတိုင်း ဆော့ဖ်ဝဲဖြင့် ဖြုတ်ပြီး ပြန်တပ်ပါမည် — လက်ဖြင့် ဖြုတ်ပြီး ပြန်ထိုးသည်နှင့် အတူတူပင်။\n\nဤသည်မှာ ကွန်ရက်ကတ်ကို စောင့်ကြည့်ခြင်းနှင့် မတူပါ။ ကွန်ရက်ကတ်ကို IP၊ ဂိတ်ဝေး၊ ဆက်သွယ်မှုဖြင့် စစ်နိုင်၍ တကယ်ပျက်မှသာ ပြင်သည်။ သာမန် USB ကိရိယာတွင် ထိုသို့စစ်နည်း မရှိသဖြင့် ခြွင်းချက်မရှိ ပြန်လည်သတ်မှတ်ရုံသာ ရှိသည်။\n\nထို့ကြောင့် အချိန်မရွေး ဖြုတ်လို့ရသော ကိရိယာများကိုသာ အမှတ်ခြစ်ပါ။ ပြင်ပ ဟာ့ဒ်ဒရိုက်၊ USB မှတ်ဉာဏ်၊ SD ကတ်ဖတ်စက်၊ ရိုက်ကူးနေဆဲ capture ကတ် — ဖတ်နေ ရေးနေစဉ် ပြန်လည်သတ်မှတ်ခံရလျှင် အပေါ့ဆုံး ဖိုင်ပျက်ပြီး၊ အဆိုးဆုံး တစ်ဒရိုက်လုံး ပြင်ရပါမည်။ ထိုကိရိယာများကို အမှတ်မခြစ်ပါနှင့်။ အမှန်တကယ် လိုအပ်ပါက အောက်ရှိ တစ်ကြိမ်တည်း ပြန်လည်သတ်မှတ်ခြင်းကို သုံးပြီး ရေးသားမှု ရပ်ပြီးကြောင်း ကိုယ်တိုင် အရင်စစ်ပါ။
