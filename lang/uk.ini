211=Кожен позначений тут пристрій після кожного пробудження буде програмно від'єднано і знову під'єднано — те саме, що вийняти його і вставити назад.\n\nЦе не те саме, що охорона мережевого інтерфейсу: інтерфейс перевіряється за IP, шлюзом і зв'язністю та лагодиться лише тоді, коли справді зламаний. Звичайний USB-пристрій такої перевірки не дає, тож лишається тільки скидати його беззастережно.\n\nТому позначайте лише ті пристрої, які можна вийняти будь-якої миті. Зовнішні диски, флешки, зчитувачі SD, плата захоплення посеред запису: якщо такий пристрій скинути під час читання чи запису, у кращому разі втратите файл, у гіршому — доведеться відновлювати весь том. Їх позначати не варто; якщо скидання все ж потрібне, скористайтеся разовим скиданням нижче, попередньо переконавшись, що запис припинено.
