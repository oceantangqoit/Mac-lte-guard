74=Після експорту цей мовний файл стає твоєю копією: підпис первісного автора вилучається й замінюється твоїм іменем, а відтоді за вміст відповідаєш ти і він уже не стосується автора.

Не пиши нічого незаконного чи образливого й нічого, що порушує права інших. Змінений файл лишається лише на твоєму комп'ютері й нікуди не надсилається. Хочеш поділитися — ласкаво просимо на сторінку проєкту.
