195=Тут зібрано все, що стосується оновлень. Оберіть, як часто перевіряти, — програма сама перевірить, завантажить і встановить у цьому ритмі, а тоді перезапуститься, не відволікаючи вас. Інсталяційні пакети завжди лишаються в підтеці updates теки налаштувань, тож слід зберігається.
