211=Всяко отбелязано тук устройство ще бъде след всяко събуждане софтуерно изключено и включено отново — същото, като да го извадите и върнете.\n\nТова не е същото като пазенето на мрежов интерфейс: интерфейсът се проверява по IP, шлюз и свързаност и се поправя само когато наистина е повреден. Обикновено USB устройство не допуска такава проверка, тъй че остава само да бъде занулено безусловно.\n\nЗатова отбелязвайте само устройства, които могат да се изваждат по всяко време. Външни дискове, USB памети, четци за SD карти, карта за запис насред записване: ако такова устройство бъде занулено по време на четене или запис, в по-добрия случай губите файла, в по-лошия целият том трябва да се възстановява. Тях не отбелязвайте; ако все пак се налага, използвайте еднократното зануляване по-долу, след като се уверите, че вече нищо не се записва.
