210=Escolher os dispositivos USB a vigiar…
211=Cada dispositivo que assinalar aqui sofrerá uma desconexão e reconexão por software depois de cada despertar — o equivalente a retirá-lo e voltar a ligá-lo.\n\nNão é o mesmo que vigiar uma interface de rede: uma interface pode ser verificada pelo IP, pela gateway e pela ligação, e só é reparada quando está de facto avariada. Um dispositivo USB comum não permite essa verificação, pelo que só resta reiniciá-lo sem condições.\n\nAssinale por isso apenas dispositivos que possam ser desligados a qualquer momento. Discos externos, pens USB, leitores de cartões SD ou uma placa de captura a meio de uma gravação: se um deles for reiniciado durante uma leitura ou escrita, na melhor das hipóteses perde o ficheiro e na pior fica com um volume inteiro por reparar. Deixe esses por assinalar; se mesmo assim precisar de reiniciar algum, use o reinício pontual abaixo e certifique-se antes de que já nada está a escrever.
