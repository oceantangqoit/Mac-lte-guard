211=Setiap peranti yang anda tandakan di sini akan dicabut dan dipasang semula secara perisian selepas setiap kali Mac bangun — sama seperti mencabutnya lalu memasangnya kembali.\n\nIni bukan perkara yang sama dengan mengawal antara muka rangkaian: antara muka boleh diuji melalui IP, get laluan dan kesambungan, jadi ia hanya dibaiki apabila benar-benar rosak. Peranti USB biasa tidak menawarkan ujian sebegitu, maka yang tinggal hanyalah menetapkannya semula tanpa syarat.\n\nOleh itu tandakan hanya peranti yang boleh dicabut pada bila-bila masa. Cakera luaran, pemacu kilat, pembaca kad SD atau kad rakaman yang sedang merakam: jika salah satunya ditetapkan semula ketika sedang dibaca atau ditulis, paling ringan failnya rosak, paling teruk seluruh volum perlu dibaiki. Jangan tandakan peranti sebegitu; jika benar-benar perlu, gunakan penetapan semula sekali sahaja di bawah, dan pastikan dahulu penulisan telah berhenti.
