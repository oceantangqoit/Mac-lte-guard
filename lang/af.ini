211=Elke toestel wat u hier merk, word ná elke ontwaking outomaties met sagteware ontkoppel en weer gekoppel — dieselfde as om dit uit te trek en terug te steek.\n\nDit is nie dieselfde as om 'n netwerkkoppelvlak te bewaak nie: 'n koppelvlak kan met IP, poort en verbinding getoets word en word net herstel as dit werklik stukkend is. 'n Gewone USB-toestel bied geen sodanige toets nie, dus bly daar niks anders oor as om dit onvoorwaardelik terug te stel nie.\n\nMerk daarom net toestelle wat enige oomblik uitgetrek mag word. Eksterne skywe, USB-stokkies, SD-kaartlesers of 'n opnamekaart middel in 'n opname: word so 'n toestel teruggestel terwyl daar gelees of geskryf word, verloor u in die beste geval die lêer en in die ergste geval moet die hele volume herstel word. Laat dié ongemerk; as dit tog moet, gebruik die eenmalige terugstelling hieronder en maak eers seker dat niks meer skryf nie.
