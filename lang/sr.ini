211=Сваки овде означен уређај биће после сваког буђења софтверски искључен и поново прикључен — исто као да га извадите и вратите.\n\nТо није исто што и чување мрежног прикључка: прикључак се проверава преко IP адресе, мрежног пролаза и повезаности, па се поправља тек кад је заиста покварен. Обичан USB уређај такву проверу не омогућава, те преостаје само да се безусловно ресетује.\n\nЗато означавајте само уређаје који се сваког часа смеју извадити. Спољашњи дискови, USB меморије, читачи SD картица, картица за снимање усред снимања: буде ли такав уређај ресетован током читања или уписа, у бољем случају губите датотеку, у горем цео том треба поправљати. Њих немојте означавати; ако ресетовање ипак мора, употребите једнократно ресетовање ниже, пошто се уверите да се више ништа не уписује.
