211=勾選的裝置，每次 Mac 喚醒後都會被自動做一次軟體拔插——相當於拔下來再插回去。\n\n這與網卡守護不是一回事：網卡能用 IP、閘道、連通性驗出好壞，壞了才修；普通 USB 裝置驗不出好壞，只能不問青紅皂白重置一次。\n\n所以請只勾選「隨時可以被拔插」的裝置。行動硬碟、隨身碟、SD 讀卡機、正在錄音錄影的擷取卡這類裝置，一旦在讀寫途中被重置，輕則檔案損壞，重則整個磁區需要修復。這類裝置請不要勾選；確有需要時，用下面的單次重置，並在動手前自己確認已經停止讀寫。
