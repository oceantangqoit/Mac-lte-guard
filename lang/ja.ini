211=この画面で【守護】にチェックした機器は、Mac が復帰するたびに自動でソフト的な抜き差しを受けます——実際に抜いて挿し直すのと同じことです。\n\nチェックしてよいのは「いつ抜かれても構わない」機器だけです。それがデータを守る唯一の条件です。\n\n外付けドライブ、USB メモリ、SD カードリーダー、録音録画中のキャプチャカード——これらを読み書きの最中にリセットすれば、軽くてファイル破損、重ければパーティション全体の修復が必要になります。この種の機器には【チェックを入れないでください】。\n\nどうしても必要なときは、一つ上の階層にある単発リセットを使い、読み書きが止まっていることをご自分で確かめてから実行してください。
