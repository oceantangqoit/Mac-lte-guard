# Key numbering rules (important):
#   * Keys are append-only and never reused. When a feature is removed its key
#     is retired, so a user's older file in ~/.lte-guard-lang/ can never map to
#     an unrelated string in a newer build.
#   * Retired: 8, 9, 19, 20, 37, 62, 63 (sleep-policy feature, removed in v1.4.0)
#   * New strings always take the next free number; no need to reserve gaps.

