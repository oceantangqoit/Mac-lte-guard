211=Les appareils cochés comme SURVEILLÉS dans cet écran subissent un débranchement-rebranchement logiciel à chaque réveil du Mac — l'équivalent de retirer la prise et de la remettre.\n\nNe cochez que des appareils qui peuvent être débranchés à tout moment. C'est à cette condition qu'aucune donnée n'est perdue.\n\nDisques externes, clés USB, lecteurs de cartes SD, cartes d'acquisition en pleine capture : réinitialiser l'un d'eux pendant une lecture ou une écriture, c'est au mieux un fichier corrompu, au pire une partition à réparer. NE COCHEZ PAS ces appareils.\n\nEn cas de nécessité, utilisez la réinitialisation ponctuelle du menu au niveau supérieur, après vous être assuré vous-même que toute lecture et écriture a cessé.
