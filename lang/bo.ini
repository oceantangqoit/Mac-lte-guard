211=འདིར་རྟགས་བརྒྱབ་པའི་སྒྲིག་ཆས་རེ་རེ་ Mac སད་རྗེས་ཐེངས་རེ་བཞིན་མཉེན་ཆས་ཀྱིས་ཕྱིར་འདོན་ནས་སླར་འཇུག་བྱེད། ལག་པས་ཕྱིར་བཏོན་ནས་སླར་བཅུག་པ་དང་གཅིག་མཚུངས་རེད།\n\nའདི་ནི་དྲ་བྱང་སྲུང་སྐྱོབ་དང་མི་འདྲ། དྲ་བྱང་ལ་ IP དང་སྒོ་མོ། འབྲེལ་མཐུད་ཀྱིས་བརྟག་ཐུབ་པས་ཏན་ཏན་སྐྱོན་ཤོར་བའི་དུས་སུ་གསོ་བཅོས་བྱེད། སྤྱིར་བཏང་གི་ USB སྒྲིག་ཆས་ལ་དེ་འདྲའི་བརྟག་ཐབས་མེད་པས་རྐྱེན་མེད་པར་སླར་སྒྲིག་བྱེད་པ་ལས་ཐབས་མེད།\n\nདེས་ན་«ནམ་ཡིན་ཡང་ཕྱིར་འདོན་ཆོག་པའི»་སྒྲིག་ཆས་ལ་ཙམ་རྟགས་རྒྱོབ། ཕྱི་སྡེར། USB གསོག་ཆས། SD ཤོག་བྱང་ཀློག་ཆས། སྒྲ་བརྙན་ལེན་བཞིན་པའི་ལེན་བྱང་སོགས་ཀློག་འབྲི་བྱེད་བཞིན་པའི་སྐབས་སུ་སླར་སྒྲིག་བྱས་ན། ཡང་ན་ཡིག་ཆ་ཉམས། དྲག་ན་ཁུལ་ཡོངས་གསོ་བཅོས་དགོས། དེ་འདྲ་ལ་རྟགས་མ་རྒྱོབ། ངེས་པར་དགོས་ན་འོག་གི་ཐེངས་གཅིག་གི་སླར་སྒྲིག་སྤྱོད་ཅིང་། ལག་བསྟར་སྔོན་ལ་ཀློག་འབྲི་མཚམས་ཆད་མིན་རང་ཉིད་ཀྱིས་ཞིབ་བཤེར་བྱོས།
