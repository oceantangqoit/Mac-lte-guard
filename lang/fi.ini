211=Jokainen tähän merkitty laite irrotetaan ja kytketään ohjelmallisesti takaisin jokaisen heräämisen jälkeen — sama asia kuin vetäisi sen irti ja työntäisi takaisin.\n\nTämä ei ole sama asia kuin verkkoliitännän vartiointi: liitäntä voidaan tarkistaa IP-osoitteen, yhdyskäytävän ja yhteyden kautta, joten se korjataan vain kun se on todella rikki. Tavallinen USB-laite ei salli tällaista koetta, joten jäljelle jää vain sen ehdoton nollaaminen.\n\nMerkitse siksi vain laitteita, jotka voi irrottaa milloin tahansa. Ulkoiset levyt, muistitikut, SD-kortinlukijat tai kaappauskortti kesken tallennuksen: jos tällainen laite nollataan kesken luvun tai kirjoituksen, parhaassa tapauksessa menetät tiedoston, pahimmassa koko taltio on korjattava. Näitä älä merkitse; jos nollaus on silti tarpeen, käytä alla olevaa kertanollausta ja varmista ensin, ettei mitään enää kirjoiteta.
