211=Minden itt bejelölt eszközt minden ébredés után szoftveresen leválaszt és újra csatlakoztat a program — ugyanaz, mintha kihúzná és visszadugná.\n\nEz nem ugyanaz, mint egy hálózati csatoló őrzése: a csatoló IP-vel, átjáróval és elérhetőséggel ellenőrizhető, ezért csak akkor javítja meg, ha valóban elromlott. Egy közönséges USB-eszköz ilyen próbát nem tesz lehetővé, így nem marad más, mint feltétel nélkül visszaállítani.\n\nEzért csak olyan eszközt jelöljön be, amely bármikor kihúzható. Külső lemezek, pendrive-ok, SD-kártyaolvasók vagy egy felvétel közepén lévő rögzítőkártya: ha ilyet olvasás vagy írás közben állít vissza, jobb esetben a fájl vész el, rosszabb esetben az egész kötetet helyre kell állítani. Ezeket ne jelölje be; ha mégis szükséges, használja az alábbi egyszeri visszaállítást, miután meggyőződött róla, hogy már semmi sem ír.
