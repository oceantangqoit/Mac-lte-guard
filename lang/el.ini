192=Αυτή η γλώσσα γράφεται από δεξιά προς τα αριστερά. Μετά την επανεκκίνηση όλο το μενού καθρεφτίζεται: τα υπομενού ανοίγουν αριστερά και τα βέλη δείχνουν αριστερά. Να γίνει επανεκκίνηση τώρα;
