211=Κάθε συσκευή που επιλέγετε εδώ θα αποσυνδέεται και θα επανασυνδέεται μέσω λογισμικού μετά από κάθε αφύπνιση — το ίδιο σαν να την τραβούσατε και να την ξαναβάζατε.\n\nΔεν είναι το ίδιο με τη φύλαξη μιας δικτυακής διεπαφής: η διεπαφή ελέγχεται με IP, πύλη και συνδεσιμότητα, και επισκευάζεται μόνο όταν όντως έχει χαλάσει. Μια συνηθισμένη συσκευή USB δεν προσφέρει τέτοιον έλεγχο, οπότε το μόνο που απομένει είναι η άνευ όρων επαναφορά της.\n\nΓι' αυτό επιλέγετε μόνο συσκευές που μπορούν να αποσυνδεθούν οποιαδήποτε στιγμή. Εξωτερικοί δίσκοι, στικάκια USB, αναγνώστες καρτών SD, κάρτα καταγραφής στη μέση μιας εγγραφής: αν μια τέτοια συσκευή επανέλθει ενώ διαβάζεται ή γράφεται, στην καλύτερη περίπτωση χάνετε το αρχείο, στη χειρότερη πρέπει να επισκευαστεί ολόκληρος ο τόμος. Αυτές μην τις επιλέγετε· αν πράγματι χρειάζεται, χρησιμοποιήστε την εφάπαξ επαναφορά παρακάτω, αφού βεβαιωθείτε ότι δεν γράφει πια τίποτε.
