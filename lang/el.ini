195=Εδώ βρίσκονται όλα όσα αφορούν τις ενημερώσεις. Επιλέξτε κάθε πότε να γίνεται έλεγχος — το πρόγραμμα θα ελέγξει, θα κατεβάσει και θα εγκαταστήσει με αυτόν τον ρυθμό και θα επανεκκινήσει μόνο του, χωρίς να σας διακόψει. Τα πακέτα εγκατάστασης μένουν πάντα στον υποφάκελο updates του φακέλου ρυθμίσεων, ώστε να υπάρχει ίχνος.
