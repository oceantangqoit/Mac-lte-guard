74=Μετά την εξαγωγή, αυτό το αρχείο γλώσσας γίνεται δικό σου αντίγραφο: η υπογραφή του αρχικού δημιουργού αφαιρείται και αντικαθίσταται με το όνομά σου, και από εκεί και πέρα το περιεχόμενο είναι δική σου ευθύνη και δεν αφορά πια τον δημιουργό.

Μη γράφεις παράνομο ή προσβλητικό περιεχόμενο ούτε κάτι που θίγει δικαιώματα άλλων. Το τροποποιημένο αρχείο μένει μόνο στον υπολογιστή σου και δεν ανεβαίνει πουθενά. Αν θέλεις να το μοιραστείς, είσαι ευπρόσδεκτος στη σελίδα του έργου.
