70=Τα κείμενα της εφαρμογής μεταφράστηκαν με τη βοήθεια τεχνητής νοημοσύνης και δεν έχουν ελεγχθεί όλα από φυσικούς ομιλητές. Ορισμένες διατυπώσεις μπορεί να είναι αδέξιες ή ανακριβείς. Δεν υπάρχει καμία πρόθεση προσβολής οποιουδήποτε λαού, περιοχής ή κοινότητας. Οι διορθώσεις είναι ευπρόσδεκτες στη σελίδα του έργου.
