211=Varje enhet du kryssar för här kopplas efter varje uppvaknande bort och in igen med programvara — samma sak som att dra ur den och sätta tillbaka den.\n\nDetta är inte detsamma som att vakta ett nätverksgränssnitt: ett gränssnitt kan prövas med IP, gateway och anslutning, och lagas därför bara när det verkligen är trasigt. En vanlig USB-enhet medger ingen sådan prövning, så det enda som återstår är att återställa den villkorslöst.\n\nKryssa därför bara för enheter som får dras ur när som helst. Externa diskar, USB-minnen, SD-kortläsare eller ett inspelningskort mitt i en inspelning: återställs en sådan enhet under läsning eller skrivning förlorar du i bästa fall filen, i värsta fall måste hela volymen lagas. Låt dem vara okryssade; om återställning ändå behövs, använd engångsåterställningen nedan och förvissa dig först om att inget längre skrivs.
