211=इस स्क्रीन पर जिन उपकरणों को आप «रक्षित» चिह्नित करते हैं, Mac के हर बार जागने पर उन्हें सॉफ़्टवेयर से निकालकर फिर लगाया जाता है — ठीक वैसे ही जैसे प्लग खींचकर वापस लगाना।\n\nकेवल वही उपकरण चिह्नित करें जिन्हें किसी भी क्षण निकाला जा सके। आँकड़े सुरक्षित रहने की शर्त यही है।\n\nबाहरी ड्राइव, USB स्टिक, SD कार्ड रीडर, रिकॉर्डिंग के बीच का कैप्चर कार्ड: इनमें से किसी को पढ़ते या लिखते समय रीसेट करना अच्छे से अच्छी स्थिति में एक क्षतिग्रस्त फ़ाइल है और बुरे से बुरी में एक विभाजन जिसकी मरम्मत करनी पड़े। ऐसे उपकरण कदापि चिह्नित न करें।\n\nयदि सचमुच आवश्यक हो तो एक स्तर ऊपर के मेन्यू में दिया एकबारगी रीसेट काम में लें, और उससे पहले स्वयं सुनिश्चित कर लें कि पढ़ना-लिखना रुक चुका है।
