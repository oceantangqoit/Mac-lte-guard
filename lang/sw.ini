211=Kila kifaa unachotia alama hapa kitachomolewa na kuchomekwa tena kwa programu baada ya kila kuamka — sawa na kukichomoa kwa mkono na kukirudisha.\n\nHii si sawa na kulinda kadi ya mtandao: kadi ya mtandao inaweza kupimwa kwa IP, lango na muunganisho, hivyo hurekebishwa tu ikiwa imeharibika kweli. Kifaa cha kawaida cha USB hakina kipimo cha namna hiyo, hivyo hakuna njia ila kukirudisha upya bila masharti.\n\nKwa hiyo tia alama tu vifaa vinavyoweza kuchomolewa wakati wowote. Diski za nje, vijiti vya USB, visomaji vya kadi za SD, au kadi ya kunasa katikati ya kurekodi: kikirudishwa upya wakati wa kusoma au kuandika, kwa upole faili litaharibika, kwa ukali sehemu nzima itahitaji kutengenezwa. Hivyo usivitie alama; kama ni lazima kweli, tumia urudishaji wa mara moja hapa chini, na kwanza hakikisha mwenyewe kwamba kuandika kumesimama.
