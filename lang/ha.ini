211=Duk na'urar da ka yiwa alama a nan za a cire ta a sake toshe ta ta hanyar manhaja bayan kowace farkawa — daidai da cire ta da hannu sannan a sake sanya ta.\n\nWannan ba daidai yake da tsare katin sadarwa ba: ana iya gwada katin sadarwa ta hanyar IP, ƙofar hanya da haɗin kai, saboda haka sai lokacin da ya lalace da gaske ake gyara shi. Na'urar USB ta yau da kullum ba ta da irin wannan gwaji, don haka babu abin da ya rage sai a sake saita ta ba tare da wani sharadi ba.\n\nSaboda haka ka yiwa alama na'urorin da za a iya cirewa a kowane lokaci kawai. Faifan waje, sandunan USB, na'urorin karanta katin SD, ko katin ɗaukar hoto a tsakiyar rikodi: idan aka sake saita irin wannan a tsakiyar karatu ko rubutu, mafi sauƙi shi ne fayil ɗin ya lalace, mafi tsanani kuma sai an gyara dukan ɓangaren. Kada ka yiwa waɗannan alama; idan da gaske ya zama dole, yi amfani da sake saitin lokaci ɗaya da ke ƙasa, kuma ka fara tabbatar da kanka cewa rubutu ya tsaya.
