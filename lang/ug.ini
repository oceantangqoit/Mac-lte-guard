211=بۇ يەردە بەلگە قويۇلغان ھەر بىر ئۈسكۈنە Mac ئويغانغان ھەر قېتىمدىن كېيىن يۇمشاق دېتال ئارقىلىق ئۈزۈلۈپ قايتا چېتىلىدۇ — قولدا سۇغۇرۇپ قايتا چاتقانغا ئوخشاش.\n\nبۇ تور كارتىسىنى قوغداش بىلەن ئوخشاش ئەمەس: تور كارتىسىنى IP، تور ئۆتكىلى ۋە ئۇلىنىش ئارقىلىق سىناشقا بولىدۇ، شۇڭا راستىنلا بۇزۇلغاندىلا ئوڭشىلىدۇ. ئادەتتىكى USB ئۈسكۈنىسىدە بۇنداق سىناش يوق، شۇڭا شەرتسىز ئەسلىگە قايتۇرۇشتىن باشقا ئامال قالمايدۇ.\n\nشۇڭا پەقەت «خالىغان ۋاقىتتا سۇغۇرۇشقا بولىدىغان» ئۈسكۈنىلەرگىلا بەلگە قويۇڭ. سىرتقى دىسكا، USB ساقلىغۇچ، SD كارتا ئوقۇغۇچ ياكى خاتىرىلەۋاتقان تۇتقۇچ كارتا قاتارلىقلار ئوقۇلۇۋاتقان ياكى يېزىلىۋاتقان ۋاقىتتا ئەسلىگە قايتۇرۇلسا، يېنىكى ھۆججەت بۇزۇلىدۇ، ئېغىرى پۈتۈن رايوننى ئوڭشاشقا توغرا كېلىدۇ. بۇنداق ئۈسكۈنىلەرگە بەلگە قويماڭ؛ راستىنلا زۆرۈر بولسا، تۆۋەندىكى بىر قېتىملىق ئەسلىگە قايتۇرۇشنى ئىشلىتىڭ ۋە ئالدىن ئوقۇش-يېزىشنىڭ توختىغانلىقىنى ئۆزىڭىز جەزملەشتۈرۈڭ.
