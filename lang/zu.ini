211=Yonke idivayisi oyimakayo lapha izokhishwa iphinde ifakwe ngesofthiwe ngemva kokuvuka ngakunye — kufana nokuyikhipha ngesandla uphinde uyifake.\n\nLokhu akufani nokuqapha ikhadi lenethiwekhi: ikhadi lenethiwekhi lingahlolwa nge-IP, isango kanye nokuxhumana, ngakho lilungiswa kuphela uma seliphukile ngempela. Idivayisi evamile ye-USB ayinalo uhlobo lokuhlola olunjalo, ngakho akukho okunye ngaphandle kokuyisetha kabusha ngaphandle kwemibandela.\n\nNgakho maka kuphela amadivayisi angakhishwa noma nini. Amadrayivu angaphandle, ama-USB stick, abafundi bamakhadi e-SD, noma ikhadi lokuqopha phakathi nokuqopha: uma elinye lalezi lisethwa kabusha ngesikhathi kufundwa noma kubhalwa, okulula kuwukuthi ifayela lonakale, okubi kakhulu kuwukuthi ivolumu yonke idinge ukulungiswa. Ungawamaki lawo; uma kudingeka ngempela, sebenzisa ukusetha kabusha kwesikhathi esisodwa okungezansi, futhi uqale uqinisekise wena ukuthi ukubhala sekumile.
