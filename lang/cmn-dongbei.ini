211=勾上的设备，每回 Mac 醒过来都自动给它来一次软件拔插——就跟拔下来再插上一个样。\n\n这跟守网卡可不是一码事：网卡有 IP、网关、通不通能验，坏了才修；普通 USB 设备验不出好赖，只能不管三七二十一重置一回。\n\n所以只勾「啥时候拔都行」的设备。移动硬盘、U 盘、SD 读卡器、正录着音录着像的采集卡这些玩意儿，读写半道上被重置，轻的文件坏了，重的整个分区得修。这些别勾；真要用，就用底下那个单次重置，动手前自己确认读写停了。
