211=Bu yerda belgilangan har bir qurilma Mac har uyg'onganda dasturiy yo'l bilan uzilib, qayta ulanadi — qo'l bilan sug'urib, qayta ulash bilan bir xil.\n\nBu tarmoq kartasini qo'riqlash bilan bir emas: kartani IP, shlyuz va aloqa orqali sinash mumkin, shu bois u chindan buzilgandagina tuzatiladi. Oddiy USB qurilmada bunday sinov yo'q, shu sababli uni shartsiz qayta o'rnatishdan boshqa chora qolmaydi.\n\nShuning uchun faqat istalgan payt sug'urib olsa bo'ladigan qurilmalarni belgilang. Tashqi disklar, USB xotiralar, SD karta o'qigichlar yoki yozuv o'rtasidagi qamrash kartasi: shunday qurilma o'qish yoki yozish orasida qayta o'rnatilsa, yengili fayl buziladi, og'iri butun bo'limni tuzatishga to'g'ri keladi. Ularni belgilamang; chindan zarur bo'lsa, quyidagi bir martalik qayta o'rnatishdan foydalaning va avval yozish to'xtaganiga o'zingiz ishonch hosil qiling.
