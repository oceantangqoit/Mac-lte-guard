211=勾住嘞设备，每回 Mac 睡醒之后都自动给它做一回软件拔插——跟拔下来再插上一样嘞。\n\n这跟看住网卡不是一码事：网卡有 IP、网关、通不通能验，坏嘞才修；平常嘞 USB 设备验不出好赖，只能不管三七二十一重置一回。\n\n所以光勾「啥时候拔都中」嘞设备。移动硬盘、U 盘、SD 读卡器、正录着音录着像嘞采集卡这些，读写半路上叫重置嘞，轻嘞文件坏嘞，重嘞整个分区得修。这些白勾；真要用，都用底下那个单回重置，动手之前自个儿确认读写停嘞。
